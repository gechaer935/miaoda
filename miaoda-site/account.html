<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="description" content="秒答账户注册、登录、余额查询与卡密兑换。">
  <title>个人中心 · 秒答</title>
  <style>
    :root{--ink:#151827;--muted:#747b8f;--line:#e4e8f1;--paper:#f6f8fc;--violet:#6557e8;--violet-dark:#4b3ec6;--green:#15966c;--danger:#c84455;--shadow:0 26px 80px rgba(36,40,76,.13);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 5%,rgba(101,87,232,.13),transparent 27rem),radial-gradient(circle at 88% 20%,rgba(29,185,212,.10),transparent 26rem),var(--paper)}button,input{font:inherit}.top{height:74px;border-bottom:1px solid rgba(228,232,241,.9);background:rgba(246,248,252,.82);backdrop-filter:blur(18px)}.nav{width:min(1160px,calc(100% - 40px));height:100%;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;color:var(--ink);font-size:21px;font-weight:800;text-decoration:none}.mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:white;background:linear-gradient(135deg,var(--violet),#1db9d4);box-shadow:0 9px 24px rgba(101,87,232,.3)}.nav-actions{display:flex;align-items:center;gap:12px}.back{color:#5d6478;text-decoration:none;font-size:14px}.download-client{min-height:42px;padding:0 18px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;color:white;background:var(--ink);box-shadow:0 10px 24px rgba(21,24,39,.2);font-size:14px;font-weight:750;text-decoration:none;transition:.2s ease}.download-client:hover{transform:translateY(-1px);background:#252a3f;box-shadow:0 13px 28px rgba(21,24,39,.25)}.layout{width:min(1080px,calc(100% - 40px));min-height:calc(100vh - 74px);margin:auto;display:grid;grid-template-columns:.9fr 1.1fr;gap:70px;align-items:center;padding:64px 0}.intro small{display:inline-flex;padding:7px 12px;border:1px solid #dedafc;border-radius:999px;color:var(--violet-dark);background:#ffffffb8;font-weight:700}.intro h1{margin:24px 0 18px;font-size:clamp(42px,5.4vw,68px);line-height:1.08;letter-spacing:-.06em}.intro h1 span{color:transparent;background:linear-gradient(100deg,var(--violet-dark),#159fba);background-clip:text}.intro p{max-width:480px;color:var(--muted);font-size:16px;line-height:1.85}.points{display:flex;flex-wrap:wrap;gap:9px;margin-top:26px}.points span{padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:#ffffffa8;color:#60677a;font-size:12px}.card{padding:34px;border:1px solid rgba(255,255,255,.95);border-radius:24px;background:rgba(255,255,255,.92);box-shadow:var(--shadow)}.tabs{display:flex;gap:5px;padding:4px;border-radius:12px;background:#f1f3f8}.tab{flex:1;height:42px;border:0;border-radius:9px;color:#6a7184;background:transparent;cursor:pointer}.tab.active{color:var(--ink);background:#fff;box-shadow:0 4px 14px rgba(28,35,62,.08);font-weight:750}.panel{display:none}.panel.active{display:block}.head{margin:28px 0 24px}.head h2{margin:0 0 8px;font-size:27px;letter-spacing:-.035em}.head p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}.fields{display:grid;gap:16px}.field{display:grid;gap:7px}.field span{font-size:13px;font-weight:700}.field input{width:100%;height:48px;padding:0 14px;border:1px solid #dce1eb;border-radius:12px;outline:0;color:var(--ink);background:#fbfcfe}.field input:focus{border-color:#8c82ee;box-shadow:0 0 0 3px rgba(101,87,232,.1)}.submit{width:100%;height:49px;margin-top:20px;border:0;border-radius:12px;color:white;background:var(--violet);font-weight:750;cursor:pointer;box-shadow:0 11px 26px rgba(101,87,232,.25)}.submit:disabled{opacity:.55;cursor:wait}.message{display:none;margin-top:15px;padding:11px 13px;border-radius:10px;font-size:13px;line-height:1.55}.message.show{display:block}.message.error{color:#a93749;background:#fff0f2}.message.success{color:#147653;background:#eaf9f2}.help{margin-top:17px;color:#8a90a1;font-size:12px;line-height:1.65}.help button{padding:0;border:0;color:var(--violet-dark);background:none;cursor:pointer;text-decoration:underline}.dashboard{display:none}.dashboard.active{display:block}.account-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.account-head small{color:var(--muted)}.account-head h2{margin:6px 0 0;font-size:27px}.account-actions{display:flex;gap:8px}.logout{border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:#687083;background:#fff;cursor:pointer}.change-password{color:var(--violet-dark);background:#f1efff}.balance{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0}.balance article{padding:20px;border:1px solid var(--line);border-radius:16px;background:#fafbfe}.balance span{color:#7b8296;font-size:12px}.balance strong{display:block;margin-top:9px;font-size:25px}.balance strong i{font-size:13px;font-style:normal;color:#8990a2}.redeem{padding:20px;border-radius:16px;background:#171b2c;color:white}.redeem h3{margin:0 0 7px}.redeem p{margin:0 0 15px;color:#aeb4ca;font-size:12px;line-height:1.6}.redeem-row{display:flex;gap:9px}.redeem-row input{min-width:0;flex:1;height:45px;padding:0 13px;border:1px solid #343a53;border-radius:10px;color:white;background:#22283d;outline:0;text-transform:uppercase}.redeem-row button,.redeem-row .buy-card{flex:0 0 auto;height:45px;padding:0 17px;border-radius:10px;font-weight:700;white-space:nowrap}.redeem-row button{border:0;color:white;background:var(--violet);cursor:pointer}.redeem-row .buy-card{display:inline-flex;align-items:center;justify-content:center;border:1px solid #1f7f92;color:#8fe3f2;background:#1b2b33;text-decoration:none}.redeem-row .buy-card:hover{border-color:#2fb6d2;color:white;background:#204049}.password-box{display:none;margin-top:18px;padding:20px;border:1px solid #ddd9ff;border-radius:16px;background:#f8f7ff}.password-box.show{display:block}.password-box h3{margin:0 0 6px}.password-box>p{margin:0 0 16px;color:var(--muted);font-size:12px}.password-actions{display:flex;gap:9px}.password-actions .submit{margin-top:0}.password-actions .logout{flex:0 0 auto}.contact-box{display:none;margin-top:20px;padding:17px;border:1px solid var(--line);border-radius:14px;background:#fafbfe}.contact-box.show{display:block}.contact-box h3{margin:0 0 8px;font-size:15px}.contact-box p{margin:4px 0;color:#737b8f;font-size:13px}@media(max-width:820px){.layout{grid-template-columns:1fr;gap:35px;padding:40px 0 65px}.intro{text-align:center}.intro p{margin-left:auto;margin-right:auto}.points{justify-content:center}}@media(max-width:520px){.nav,.layout{width:min(100% - 26px,1080px)}.top{height:66px}.nav-actions{gap:8px}.download-client{min-height:38px;padding:0 12px;font-size:12px}.layout{min-height:calc(100vh - 66px);padding-top:28px}.intro h1{font-size:42px}.card{padding:24px 18px;border-radius:19px}.balance{grid-template-columns:1fr}.account-head{align-items:flex-start}.account-actions{display:grid}.redeem-row{display:grid}.redeem-row button,.redeem-row .buy-card{height:44px}}@media(max-width:390px){.back{display:none}}
  </style>
</head>
<body>
  <header class="top"><nav class="nav"><a class="brand" href="/"><span class="mark">秒</span><span>秒答</span></a><div class="nav-actions"><a class="back" href="/">返回官网</a><a class="download-client" href="/download/latest">下载客户端</a></div></nav></header>
  <main class="layout">
    <section class="intro"><small>秒答个人中心</small><h1>一个账户，管理<br><span>全部使用额度。</span></h1><p id="trial-intro">新注册用户可获得 5 分钟面试体验和 1 次笔试体验，到账后可直接在客户端使用。</p><div class="points"><span>新客体验自动到账</span><span>多张卡密额度可叠加</span></div></section>
    <section class="card">
      <div id="auth-view">
        <div class="tabs"><button class="tab active" data-tab="login">登录</button><button class="tab" data-tab="register">注册</button></div>
        <form class="panel active" id="login-panel">
          <div class="head"><h2>登录秒答</h2><p>输入用户名和密码，查看余额或兑换卡密。</p></div>
          <div class="fields"><label class="field"><span>用户名</span><input id="login-username" required minlength="4" maxlength="32" autocomplete="username" placeholder="输入用户名"></label><label class="field"><span>密码</span><input id="login-password" required minlength="8" maxlength="24" type="password" autocomplete="current-password" placeholder="输入密码（8～24 位）"></label></div>
          <div class="message" id="login-message"></div><button class="submit" type="submit">登录</button><div class="help">忘记密码请<button type="button" data-contact>联系客服</button>重置：</div>
        </form>
        <form class="panel" id="register-panel">
          <div class="head"><h2>创建账户</h2><p id="register-trial-copy">符合条件的新用户注册后，5 分钟面试和 1 次笔试体验将自动到账。</p></div>
          <div class="fields"><label class="field"><span>用户名</span><input id="register-username" required minlength="4" maxlength="32" autocomplete="username" placeholder="4～32 位字母、数字、中文、_ 或 -"></label><label class="field"><span>密码</span><input id="register-password" required minlength="8" maxlength="24" type="password" autocomplete="new-password" placeholder="输入密码（8～24 位）"></label><label class="field"><span>确认密码</span><input id="register-confirm" required minlength="8" maxlength="24" type="password" autocomplete="new-password" placeholder="再次输入密码"></label></div>
          <div class="message" id="register-message"></div><button class="submit" type="submit">创建账户</button><div class="help">忘记密码请<button type="button" data-contact>联系客服</button>重置：</div>
        </form>
      </div>
      <div class="dashboard" id="dashboard">
        <div class="account-head"><div><small>当前账户</small><h2 id="account-username">-</h2></div><div class="account-actions"><button class="logout change-password" id="change-password" type="button">修改密码</button><button class="logout" id="logout">退出登录</button></div></div>
        <div class="balance"><article><span>面试余额</span><strong><b id="interview-minutes">0</b> <i>分钟</i></strong></article><article><span>笔试余额</span><strong><b id="written-questions">0</b> <i>题</i></strong></article></div>
        <div class="redeem"><h3>兑换卡密</h3><p>同一账户可兑换多张不同卡密，额度自动叠加。</p><div class="redeem-row"><input id="redeem-key" maxlength="40" placeholder="例如 MD-XXXX-XXXX-XXXX"><button id="redeem-button" type="button">立即兑换</button><a href="/account.html">联系部署管理员</a></div><div class="message" id="redeem-message"></div></div>
        <form class="password-box" id="password-box"><h3>修改登录密码</h3><p>修改成功后所有设备会退出登录，请使用新密码重新登录。</p><div class="fields"><label class="field"><span>当前密码</span><input id="current-password" required type="password" minlength="8" maxlength="24" autocomplete="current-password"></label><label class="field"><span>新密码</span><input id="new-password" required type="password" minlength="8" maxlength="24" autocomplete="new-password"></label><label class="field"><span>确认新密码</span><input id="confirm-password" required type="password" minlength="8" maxlength="24" autocomplete="new-password"></label></div><div class="message" id="password-message"></div><div class="password-actions"><button class="submit" type="submit">确认修改</button><button class="logout" id="cancel-password" type="button">取消</button></div></form>
        <div class="contact-box" id="contact-box"><h3>联系客服</h3><div id="contact-lines"></div></div>
      </div>
      <div class="contact-box" id="public-contact-box"><h3>联系客服</h3><div id="public-contact-lines"></div></div>
    </section>
  </main>
  <script src="/analytics.js" defer></script>
  <script>
    const API='';
    const DEVICE_KEY='miaoda_web_device_id';
    const $=id=>document.getElementById(id);
    localStorage.removeItem('miaoda_account_token');
    const contact={supportEmail:'',supportQQ:'',supportWeChat:''};
    function deviceId(){let value=localStorage.getItem(DEVICE_KEY);if(!value){value=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2));localStorage.setItem(DEVICE_KEY,value)}return value}
    function setMessage(id,text,type='error'){const node=$(id);node.textContent=text;node.className='message show '+type}
    function clearMessage(id){const node=$(id);node.textContent='';node.className='message'}
    async function request(path,options={}){options.credentials='include';options.headers=Object.assign({'Content-Type':'application/json'},options.headers||{});const response=await fetch(API+path,options);let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.error?.message||'请求失败，请稍后重试');return data}
    function switchTab(name){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===name+'-panel'))}
    document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>switchTab(tab.dataset.tab)));
    function contactLines(target){const values=[];if(contact.supportQQ)values.push('QQ：'+contact.supportQQ);if(contact.supportWeChat)values.push('微信：'+contact.supportWeChat);if(contact.supportEmail)values.push('邮箱：'+contact.supportEmail);$(target).replaceChildren(...values.map(value=>{const p=document.createElement('p');p.textContent=value;return p}))}
    function showContact(){contactLines('public-contact-lines');$('public-contact-box').classList.add('show')}
    document.querySelectorAll('[data-contact]').forEach(button=>button.addEventListener('click',showContact));
    function trialAmount(offer){const minutes=Math.max(0,Number(offer?.interviewSeconds||0)/60),written=Math.max(0,Number(offer?.writtenQuestions||0));return {minutes:Number.isInteger(minutes)?String(minutes):minutes.toFixed(1),written:String(written)}}
    function applyTrialOffer(offer){if(offer?.enabled){const amount=trialAmount(offer);$('trial-intro').textContent='新注册用户可获得 '+amount.minutes+' 分钟面试体验和 '+amount.written+' 次笔试体验，到账后可直接在客户端使用。';$('register-trial-copy').textContent='符合条件的新用户注册后，'+amount.minutes+' 分钟面试和 '+amount.written+' 次笔试体验将自动到账。'}else{$('trial-intro').textContent='注册账户后可购买卡密，在账户中兑换并同步到秒答客户端。';$('register-trial-copy').textContent='注册成功后可购买并兑换卡密，额度会同步到秒答客户端。'}}
    async function loadPublicConfig(){try{const response=await fetch(API+'/api/public/config',{credentials:'include',cache:'no-store'});if(!response.ok)throw Error('config');const data=await response.json();contact.supportQQ=data.supportQQ||contact.supportQQ;contact.supportWeChat=data.supportWeChat||contact.supportWeChat;contact.supportEmail=data.supportEmail||contact.supportEmail;applyTrialOffer(data.trialOffer)}catch{}contactLines('contact-lines');contactLines('public-contact-lines')}
    function showAccount(data){$('auth-view').style.display='none';$('public-contact-box').classList.remove('show');$('dashboard').classList.add('active');$('account-username').textContent=data.username;$('interview-minutes').textContent=Math.floor(Number(data.remainingInterviewSeconds||0)/60).toLocaleString();$('written-questions').textContent=Number(data.remainingWrittenQuestions||0).toLocaleString()}
    async function refresh(){try{showAccount(await request('/api/account/me'))}catch{}}
    $('login-panel').addEventListener('submit',async event=>{event.preventDefault();clearMessage('login-message');const button=event.currentTarget.querySelector('.submit');button.disabled=true;try{const data=await request('/api/auth/account-login',{method:'POST',body:JSON.stringify({username:$('login-username').value.trim(),password:$('login-password').value,deviceId:deviceId(),deviceName:navigator.platform||'browser',platform:'web'})});showAccount({username:data.user.username,remainingInterviewSeconds:data.card.remainingInterviewSeconds,remainingWrittenQuestions:data.card.remainingWrittenQuestions})}catch(error){setMessage('login-message',error.message)}finally{button.disabled=false}});
    $('register-panel').addEventListener('submit',async event=>{event.preventDefault();clearMessage('register-message');const password=$('register-password').value;if(password!==$('register-confirm').value){setMessage('register-message','两次输入的密码不一致');return}const button=event.currentTarget.querySelector('.submit');button.disabled=true;try{const data=await request('/api/auth/register',{method:'POST',body:JSON.stringify({username:$('register-username').value.trim(),password,deviceId:deviceId(),deviceName:navigator.platform||'browser',platform:'web'})});showAccount({username:data.user.username,remainingInterviewSeconds:data.card.remainingInterviewSeconds,remainingWrittenQuestions:data.card.remainingWrittenQuestions})}catch(error){setMessage('register-message',error.message)}finally{button.disabled=false}});
    $('redeem-button').addEventListener('click',async()=>{clearMessage('redeem-message');const key=$('redeem-key').value.trim();if(!key){setMessage('redeem-message','请输入卡密');return}$('redeem-button').disabled=true;try{const result=await request('/api/account/redeem',{method:'POST',body:JSON.stringify({cardKey:key})});$('redeem-key').value='';setMessage('redeem-message','兑换成功，额度已经到账。','success');showAccount({username:$('account-username').textContent,remainingInterviewSeconds:result.remainingInterviewSeconds,remainingWrittenQuestions:result.remainingWrittenQuestions})}catch(error){setMessage('redeem-message',error.message)}finally{$('redeem-button').disabled=false}});
    $('change-password').addEventListener('click',()=>{$('password-box').classList.add('show');$('current-password').focus()});
    $('cancel-password').addEventListener('click',()=>{$('password-box').classList.remove('show');$('password-box').reset();clearMessage('password-message')});
    $('password-box').addEventListener('submit',async event=>{event.preventDefault();clearMessage('password-message');const current=$('current-password').value,next=$('new-password').value;if(next!==$('confirm-password').value){setMessage('password-message','两次输入的新密码不一致');return}const button=event.currentTarget.querySelector('.submit');button.disabled=true;try{await request('/api/account/password',{method:'POST',body:JSON.stringify({currentPassword:current,newPassword:next})});setMessage('password-message','密码修改成功，正在返回登录页……','success');setTimeout(()=>location.reload(),1200)}catch(error){setMessage('password-message',error.message)}finally{button.disabled=false}});
    $('logout').addEventListener('click',async()=>{try{await request('/api/auth/logout',{method:'POST',body:'{}'})}catch{}location.reload()});
    if(new URLSearchParams(location.search).get('tab')==='register')switchTab('register');
    loadPublicConfig();refresh();
  </script>
</body>
</html>
