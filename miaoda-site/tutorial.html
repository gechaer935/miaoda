<h1>秒答使用说明</h1>
<ol>
<li>由部署管理员配置后端模型 Key、账号系统及客户端服务地址。</li>
<li>构建并启动桌面客户端，注册账号并登录。</li>
<li>需要额度时向部署管理员领取充值卡，并在客户端兑换。</li>
<li>选择面试或笔试助手，按界面提示设置语音来源和快捷键。</li>
<li>需要手机同步时，用同一网络中的手机扫描客户端生成的配对二维码。</li>
</ol>
<p>本源码不附带公共服务、充值商城或预先生成的配对码。</p>
